[project]
name = "agentcore-poc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic==0.105.2",
    "anyio==4.13.0",
    "bedrock-agentcore>=1.23.0",
    "boto3>=1.43.93",
    "cryptography>=50.0.1",
    "cubeloop",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "openai==2.40.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
]

[tool.uv.sources]
cubeloop = { git = "https://github.com/cubeplexai/cubeloop.git", rev = "v0.14.1" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.7",
]
