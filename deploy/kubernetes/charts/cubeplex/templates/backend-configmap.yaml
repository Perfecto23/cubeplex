{{- $pgHost := include "cubeplex.postgresql.host" . -}}
{{- $redisHost := include "cubeplex.redis.host" . -}}
{{- $rustfsHost := include "cubeplex.rustfs.host" . -}}
{{- $doclingHost := include "cubeplex.docling.host" . -}}
{{- $sandbox := dict
      "enabled" true
      "use_server_proxy" (dig "sandbox" "use_server_proxy" false .Values.backend)
      "secure_access" (dig "sandbox" "secure_access" false .Values.backend)
-}}
{{- $defaults := dict -}}
{{- $_ := set $defaults "database" (dict
      "host" $pgHost
      "port" 5432
      "user" .Values.postgres.auth.username
      "name" .Values.postgres.auth.database
) -}}
{{- $_ := set $defaults "objectstore" (dict
      "provider" "s3"
      "endpoint" (printf "http://%s:9000" $rustfsHost)
      "bucket" .Values.rustfs.defaultBucket
      "region" "us-east-1"
) -}}
{{- if .Values.egress.enabled -}}
{{- $_ := set $sandbox "egress_exchange_host" (dig "sandbox" "egress_exchange_host" (printf "%s.%s.svc.cluster.local" (include "cubeplex.backend.fullname" .) .Release.Namespace) .Values.backend) -}}
{{- end -}}
{{- $_ := set $defaults "sandbox" $sandbox -}}
{{- if .Values.docling.enabled -}}
{{- $_ := set $defaults "parsers" (dict "docling_serve" (dict "base_url" (printf "http://%s:%v" $doclingHost .Values.docling.service.port))) -}}
{{- end -}}
{{- if .Values.egress.enabled -}}
{{- $_ := set $defaults "egress_exchange" (dict
      "auth" (dict "mode" "mtls")
      "listener" (dict
        "enabled" true
        "host" "0.0.0.0"
        "port" 8443
        "certfile" "/etc/egress-mtls/tls.crt"
        "keyfile" "/etc/egress-mtls/tls.key"
        "ca_certs" "/etc/egress-mtls/ca.crt"
      )
) -}}
{{- end -}}
{{- $config := mergeOverwrite (deepCopy $defaults) (deepCopy (default (dict) .Values.backend.configOverrides)) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cubeplex.backend.fullname" . }}-config
  labels:
    {{- include "cubeplex.labels" . | nindent 4 }}
data:
  config.production.local.yaml: |
    dynaconf_merge: true
    production:
      {{- toYaml $config | nindent 6 }}
