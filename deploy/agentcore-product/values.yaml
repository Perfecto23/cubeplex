# Economical single-node k3s overlay for the AgentCore product PoC.
#
# This file intentionally contains no credentials and no public hostname. The
# operator must provide image tags, auth/model/sandbox secrets, and the final
# Caddy hostname in a separate private values file or --set arguments.

image:
  registry: "986420599013.dkr.ecr.us-west-2.amazonaws.com"
  repository: "cubeplex-product-20260912"
  pullPolicy: IfNotPresent
  backend:
    name: backend
    # Required operator input: an immutable tag pushed to the product ECR repo.
    tag: ""
  frontend:
    name: frontend
    # Required operator input: an immutable tag pushed to the product ECR repo.
    tag: ""

backend:
  replicaCount: 1
  sandbox:
    # Route sandbox panel traffic through CubePlex's authenticated proxy.
    use_server_proxy: true
  secrets:
    sandbox:
      # The bundled OpenSandbox server is installed in opensandbox-system.
      # The API key is intentionally left for the operator's private overlay.
      domain: "opensandbox-server.opensandbox-system.svc.cluster.local:80"
      api_key: ""
      image: "ghcr.io/cubeplexai/cubeplex-sandbox:v0.9.4@sha256:8f3291ba1a666f55dcc2db53b851a23525e54681e99178136481fbf5a31804cc"

frontend:
  replicaCount: 1

tempo:
  enabled: false

# Caddy owns host-network 80/443 in the k3s node. Do not create an ingress
# controller from this chart; the operator supplies Caddy routing separately.
ingress:
  enabled: false

# k3s ships the local-path provisioner. Keep this chart from creating a second
# StorageClass and use persistent PVCs for the stateful services below.
storageClass:
  create: false
  name: local-path

postgres:
  enabled: true
  persistence:
    storageClass: local-path
    size: 8Gi
  # The testing node is amd64; the PGroonga/pgvector image is used only there.
  # No ARM scheduling is enabled for this PoC.

redis:
  enabled: true
  persistence:
    storageClass: local-path
    size: 2Gi

rustfs:
  enabled: true
  persistence:
    storageClass: local-path
    size: 20Gi
  # Docker Hub no longer serves this tag anonymously in the test environment.
  # Pin the amd64 manifest from the working Quay mirror instead.
  mcImage: "quay.io/minio/mc:RELEASE.2025-04-08T15-39-49Z@sha256:9ba8cb7340dd57ee994f6e2a8e45bc0dde9d5369615b03c6021105e5b9ce4449"

opensandbox:
  enabled: true
  opensandbox-controller:
    namespaceOverride: opensandbox-system
    controller:
      replicaCount: 1
      image:
        repository: opensandbox/controller
        tag: "release-1.1.1@sha256:aca5cda09a0fbc5867e6028f8b6aaa60fdcd78ebee634f71a263d45d5f6c2bab"
      snapshot:
        containerdSocketPath: /run/k3s/containerd/containerd.sock
  opensandbox-server:
    namespaceOverride: opensandbox-system
    server:
      replicaCount: 1
      image:
        repository: opensandbox/server
        tag: "release-1.1.1@sha256:bcd5f264101262cebfa7e1ff9cd0424403e42f31a6596e4364cf90d8cb5c936b"
      resources:
        requests:
          cpu: "500m"
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
