[project]
name = "cubeplex-agentcore-native-entry"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore==1.23.0",
    "boto3==1.43.75",
    "botocore==1.43.75",
    "cubeloop",
    "httpx==0.28.1",
    "openai==2.40.0",
    "pydantic==2.13.4",
    "starlette==1.3.1",
    "uvicorn==0.48.0",
]

[tool.uv.sources]
cubeloop = { git = "https://github.com/cubeplexai/cubeloop.git", rev = "bb2d6336e537f286ccac3dec072218bbec13405b" }

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "pytest==9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff==0.15.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
